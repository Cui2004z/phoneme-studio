name: Verify application and Docker
on:
  push:
    branches: [main, assessment-2]
    paths-ignore: ["docs/**", "README.md"]
  pull_request:
    paths-ignore: ["docs/**", "README.md"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check lint
        run: npm run lint
      - name: Check types and production build
        run: npm run build
      - name: Check CRUD, validation and HTML generation
        run: npm test
      - name: Build and start Docker container
        run: docker compose up --build -d
      - name: Wait for database and application health
        run: node scripts/wait-health.mjs
      - name: Check the container APIs
        run: npm run test:api
        env:
          TEST_BASE_URL: http://127.0.0.1:3000
      - name: Check persistent storage
        run: |
          node scripts/check-persistence.mjs create
          docker compose restart
          node scripts/wait-health.mjs
          node scripts/check-persistence.mjs verify
      - name: Show container status and logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
